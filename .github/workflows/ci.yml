name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Job 1: Angular Client (Build & Validation)
  # ------------------------------------------------------------
  client-ci:
    name: Angular Client CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Patient-Management-System-main/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Patient-Management-System-main/client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Build Angular Application (Production)
        run: npm run build

  # ------------------------------------------------------------
  # Job 2: Express / TypeScript API Service (Build & Validation)
  # ------------------------------------------------------------
  express-ci:
    name: Express API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Patient-Management-System-main/express-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Patient-Management-System-main/express-service/package-lock.json

      - name: Install Express Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  # ------------------------------------------------------------
  # Job 3: Laravel API & Test Suite
  # ------------------------------------------------------------
  laravel-ci:
    name: Laravel API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Patient-Management-System-main/laravel-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, zip, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('Patient-Management-System-main/laravel-service/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel Test Suite
        run: php artisan test

  # ------------------------------------------------------------
  # Job 4: Build & Push Docker Images to Docker Hub
  # ------------------------------------------------------------
  docker-hub-push:
    name: Build & Push to Docker Hub
    needs: [client-ci, express-ci, laravel-ci]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build and Push Angular Client Image
      - name: Build & Push Angular Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./Patient-Management-System-main/client
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hms-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hms-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and Push Express API Image
      - name: Build & Push Express API Image
        uses: docker/build-push-action@v5
        with:
          context: ./Patient-Management-System-main/express-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hms-express:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hms-express:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build and Push Laravel API Image
      - name: Build & Push Laravel API Image
        uses: docker/build-push-action@v5
        with:
          context: ./Patient-Management-System-main/laravel-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hms-laravel:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-hms-laravel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
