name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Job 1: Angular Client (Build & Validation)
  # ------------------------------------------------------------
  client-ci:
    name: Angular Client CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Patient-Management-System-main/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Patient-Management-System-main/client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Build Angular Application (Production)
        run: npm run build

  # ------------------------------------------------------------
  # Job 2: Express / TypeScript API Service (Build & Validation)
  # ------------------------------------------------------------
  express-ci:
    name: Express API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Patient-Management-System-main/express-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Patient-Management-System-main/express-service/package-lock.json

      - name: Install Express Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  # ------------------------------------------------------------
  # Job 3: Laravel API & Test Suite
  # ------------------------------------------------------------
  laravel-ci:
    name: Laravel API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Patient-Management-System-main/laravel-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, zip, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('Patient-Management-System-main/laravel-service/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel Test Suite
        run: php artisan test
